[package]
name = "shakechat-desktop"
version = "1.9.13"
description = "ShakeChat desktop client"
authors = ["ShakeThat"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
livekit = { version = "0.9.1", features = ["rustls-tls-native-roots"] }
nnnoiseless = "0.5.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.12.0", features = [] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
