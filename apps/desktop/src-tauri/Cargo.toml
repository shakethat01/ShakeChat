[package]
name = "shakechat-desktop"
version = "1.9.1"
description = "ShakeChat desktop client"
authors = ["ShakeThat"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
log = "0.4"
livekit = { version = "=0.9.1", features = ["rustls-tls-native-roots"] }
# Keep the Rust LiveKit graph reproducible. These exact versions are the
# combination that passed the Windows cargo check + release build; newer
# compatible-range releases currently mix prost 0.12/0.14 and fail to build.
livekit-data-stream = "=0.1.5"
livekit-protocol = "=0.7.13"
prost = "=0.12.6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = []
