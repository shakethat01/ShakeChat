name: Updater Branch Check

on:
  push:
    branches:
      - fix/updater-clean-v1
      - feature/voice-media-full-v1
      - feature/system-audio-share-v1
  workflow_dispatch:

concurrency:
  group: updater-branch-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck web and API
        run: npm run typecheck

      - name: Web tests
        env:
          LIVEKIT_PUBLIC_URL: ws://localhost:7880
        run: npm run test -w @shakechat/web

      - name: Cargo check desktop updater runtime
        run: npm run desktop:check

      - name: Generate ephemeral updater signing key
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'shakechat-ci-updater.key'
          npm run tauri -w @shakechat/desktop -- signer generate -w $key --ci
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate ephemeral updater signing key.' }
          if (-not (Test-Path "$key.pub")) { throw 'Updater public key was not generated.' }
          $publicKey = (Get-Content -Raw "$key.pub").Trim()
          if ([string]::IsNullOrWhiteSpace($publicKey)) { throw 'Updater public key is empty.' }
          "TAURI_SIGNING_PRIVATE_KEY_PATH=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHAKECHAT_UPDATER_PUBLIC_KEY=$publicKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inject updater public key into Tauri bundler config
        shell: pwsh
        run: ./tools/inject-updater-public-key.ps1

      - name: Build signed NSIS updater smoke bundle
        shell: pwsh
        run: |
          if (-not (Test-Path $env:TAURI_SIGNING_PRIVATE_KEY_PATH)) { throw 'Updater private key file is missing.' }
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -Raw $env:TAURI_SIGNING_PRIVATE_KEY_PATH
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Updater private key content is empty.' }
          npm run desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer and updater signature
        shell: pwsh
        run: |
          $nsis = Join-Path $PWD 'apps\desktop\src-tauri\target\release\bundle\nsis'
          $installer = Get-ChildItem $nsis -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $signature = Get-ChildItem $nsis -Filter '*.exe.sig' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing: $nsis" }
          if (-not $signature) { throw "Updater signature missing: $nsis" }
          Write-Host "Installer OK: $($installer.Name)"
          Write-Host "Signature OK: $($signature.Name)"
