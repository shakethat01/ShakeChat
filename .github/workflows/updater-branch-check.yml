name: Updater Branch Check

on:
  push:
    branches:
      - fix/updater-clean-v1
      - feature/voice-media-full-v1
      - feature/voice-vad-v1
      - feature/mic-test-v1
      - fix/voice-stability-1.9.9
      - fix/known-issues-1.9.10
  workflow_dispatch:

concurrency:
  group: updater-branch-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck web and API
        run: npm run typecheck

      - name: API and web tests
        env:
          LIVEKIT_PUBLIC_URL: ws://localhost:7880
        run: npm test

      - name: Cargo check desktop updater runtime
        run: npm run desktop:check

      - name: Verify production updater key configuration
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY)) { throw 'Updater signing key is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_KEY)) { throw 'Updater public key is missing.' }

      - name: Inject updater public key into Tauri bundler config
        env:
          SHAKECHAT_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        shell: pwsh
        run: ./tools/inject-updater-public-key.ps1

      - name: Build signed Windows test bundle without publishing a release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run desktop:build

      - name: Verify installer and updater signature
        shell: pwsh
        run: |
          $nsis = Join-Path $PWD 'apps\desktop\src-tauri\target\release\bundle\nsis'
          $installer = Get-ChildItem $nsis -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $signature = Get-ChildItem $nsis -Filter '*.exe.sig' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing: $nsis" }
          if (-not $signature) { throw "Updater signature missing: $nsis" }
          Write-Host "Installer OK: $($installer.Name)"
          Write-Host "Signature OK: $($signature.Name)"

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: ShakeChat-known-issues-1.9.10-test
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14
