name: Desktop Windows Native Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-windows.yml'
      - 'apps/desktop/**'
      - 'apps/web/src/useNativeVoice.ts'
      - 'apps/web/src/useVoiceRuntime.ts'
      - 'apps/web/package.json'
      - 'apps/api/src/main.ts'
      - 'tools/apply-desktop-*.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Wire desktop runtime for validation
        run: node tools/apply-desktop-native-voice-v0.1.mjs

      - name: Apply desktop Socket.IO CORS validation patch
        run: node tools/apply-desktop-api-cors-v0.1.mjs

      - name: Typecheck web and API
        run: npm run typecheck

      - name: Web tests
        env:
          LIVEKIT_PUBLIC_URL: ws://localhost:7880
        run: npm run test -w @shakechat/web

      - name: Cargo check native voice engine
        run: npm run desktop:check

      - name: Build ShakeChat desktop executable
        run: npm run desktop:build

      - name: Upload desktop alpha executable
        uses: actions/upload-artifact@v4
        with:
          name: ShakeChat-Desktop-Native-Audio-alpha
          path: apps/desktop/src-tauri/target/release/shakechat-desktop.exe
          if-no-files-found: error
