name: Screen Picker UI CI

on:
  push:
    branches:
      - feature/screen-picker-ui-1.9.14

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck web and API
        run: npm run typecheck

      - name: Legacy web tests
        continue-on-error: true
        env:
          LIVEKIT_PUBLIC_URL: ws://localhost:7880
        run: npm run test -w @shakechat/web

      - name: Cargo check desktop
        run: npm run desktop:check

      - name: Prepare preview bundle config
        shell: pwsh
        run: |
          $path = 'apps/desktop/src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = '1.9.14'
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding UTF8

      - name: Inject updater public key
        env:
          SHAKECHAT_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        shell: pwsh
        run: ./tools/inject-updater-public-key.ps1

      - name: Build ShakeChat screen picker preview installer
        env:
          SHAKECHAT_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          VITE_API_ORIGIN: https://chat.shakethat.com.tr
        run: npm run tauri -w @shakechat/desktop -- build

      - name: Upload screen picker preview installer
        uses: actions/upload-artifact@v4
        with:
          name: ShakeChat-ScreenPicker-Preview-Setup-Fixed
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
