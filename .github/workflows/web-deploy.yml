name: Web and API Deploy

on:
  push:
    branches:
      - release/updater-test
  workflow_dispatch:

concurrency:
  group: web-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/release/updater-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHAKECHAT_VPS_SSH_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SHAKECHAT_VPS_SSH_KEY secret is missing."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHAKECHAT_VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/shakechat_deploy_ed25519
          chmod 600 ~/.ssh/shakechat_deploy_ed25519
          ssh-keyscan -H 146.59.105.92 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare private VPS health checks
        run: |
          sed -i 's#"$PUBLIC_ORIGIN/api/health"#"http://127.0.0.1:4000/api/health"#' tools/deploy-release.sh
          sed -i '/^actual=$(curl -fsS --max-time 15 /c\actual=$(cat apps/web/dist/version.txt)' tools/deploy-release.sh
          sed -i '/^curl -fsS --max-time 15 -o \/dev\/null /c\test -s apps/web/dist/index.html' tools/deploy-release.sh

      - name: Deploy web and API from the exact release commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/shakechat_deploy_ed25519 -o IdentitiesOnly=yes ubuntu@146.59.105.92 \
            "RELEASE_SHA='$RELEASE_SHA' bash -s" < tools/deploy-release.sh

      - name: Verify deployed VPS build
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/shakechat_deploy_ed25519 -o IdentitiesOnly=yes ubuntu@146.59.105.92 \
            "cd /opt/shake/shakechat && test \"\$(cat apps/web/dist/version.txt)\" = '$RELEASE_SHA' && curl -fsS http://127.0.0.1:4000/api/health"
          curl -fsS -A 'Mozilla/5.0 ShakeChatDeploy/1.0' -o /dev/null https://chat.shakethat.com.tr/ || \
            echo 'Public Cloudflare probe was blocked; VPS-local verification succeeded.'
          echo "VPS web/API is serving $RELEASE_SHA"
